# Nacre supplementary detection rules (D-0011). Additive only: these never disable, override or
# shadow a vendored gitleaks rule (duplicate ids are refused by the loader). Same TOML shape as gitleaks.
# Each rule carries the D-0011 admission fields: source, source_date, fact_ids, test, holdout.
# Tightening changes are local; any loosening (new/wider allowlist, removal, relaxation) needs the
# owner's explicit approval. Sources are provider-owned documents or standards, never scanner rule sets.
title = "nacre supplementary rules v1"

[[rules]]
id = "url-userinfo-password"
description = "Password in URL userinfo (DB connection strings, credentials in URLs, legacy Sentry DSN secret)"
regex = '''[a-zA-Z][a-zA-Z0-9+.\-]*://[^\s:/?#@'"<>]+:([^\s/?#@'"<>]+)@'''
secretGroup = 1
keywords = ["://"]
source = "RFC 3986 §3.2.1; PostgreSQL libpq §32.1.1.2; MySQL 8.4 URI syntax; MongoDB connection string formats; Sentry get_dsn (getsentry/sentry@88dcaf3f projectkey.py)"
source_date = "2026-09-30"
fact_ids = []
test = "tests/ledger/test_strip_secrets.py::test_catch_rate_holdout_official"
holdout = "2026-09-30: H1 (demoted) 100%; H2 (official) 100% on holdout for credentials-in-url, mongodb, mysql, postgresql, Sentry legacy DSN (50 each); holdout FP 0.52% with all rules; H3 (official, 2026-09-30, per-character caught): 100%, longest surviving fragment 0, FP 0/400"
  # Approved with D-0011 (owner): placeholder allowlist, exactly these kinds and no others.
  [[rules.allowlists]]
  description = "placeholders: ${VAR}, $VAR, <password>, ***, password, xxx"
  regexTarget = "secret"
  regexes = ['''^\$\{?[A-Za-z_][A-Za-z0-9_]*\}?$''', '''^<[^>]*>$''', '''^\*+$''', '''^(?i:password)$''', '''^(?i:x{3,})$''']

[[rules]]
id = "github-installation-token-stateless"
description = "GitHub App installation token, stateless ghs_APPID_JWT format (2026)"
regex = '''\b(ghs_[A-Za-z0-9.\-_]{36,})'''
keywords = ["ghs_"]
source = "https://github.blog/changelog/2026-05-15-github-app-installation-tokens-per-request-override-header (GitHub's recommended regex); https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/about-authentication-to-github"
source_date = "2026-09-30"
fact_ids = []
test = "tests/ledger/test_strip_secrets.py::test_catch_rate_holdout_official"
holdout = "2026-09-30: H1 (demoted) 100%; H2 (official) 100% on holdout (ghs stateless, n=50); holdout FP 0.52% with all rules; H3 (official, 2026-09-30, per-character caught): 100%, longest surviving fragment 0, FP 0/400"

[[rules]]
id = "heroku-oauth-token"
description = "Heroku OAuth token / API key, HRKU- prefixed (UUID form, or 60 chars after the prefix)"
regex = '''\b(HRKU-(?:[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}|[A-Za-z0-9_\-]{60}))'''
keywords = ["hrku-"]
source = "https://devcenter.heroku.com/articles/oauth (65 chars); https://devcenter.heroku.com/changelog-items/2842 (UUID form); https://devcenter.heroku.com/changelog-items/2800"
source_date = "2026-09-30"
fact_ids = []   # the 60-char charset is pending an owner-measured fact; only the UUID form is asserted by tests
test = "tests/ledger/test_strip_secrets.py::test_catch_rate_holdout_official"
holdout = "2026-09-30: H1 (demoted) 100%; H2 (official) 100% on holdout (HRKU- UUID form, n=50); holdout FP 0.52% with all rules; H3 (official, 2026-09-30, per-character caught): 100%, longest surviving fragment 0, FP 0/400"

[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key (sb_secret_)"
regex = '''\b(sb_secret_[A-Za-z0-9_\-]{22}_[A-Za-z0-9_\-]{8})'''
keywords = ["sb_secret_"]
source = "https://supabase.com/docs/guides/api/api-keys; supabase/supabase@ff80bb14 docker/utils/add-new-auth-keys.sh L125-135"
source_date = "2026-09-30"
fact_ids = []
test = "tests/ledger/test_strip_secrets.py::test_catch_rate_holdout_official"
holdout = "2026-09-30: H1 (demoted) 100%; H2 (official) 100% on holdout (sb_secret, n=50); holdout FP 0.52% with all rules; H3 (official, 2026-09-30, per-character caught): 100%, longest surviving fragment 0, FP 0/400"

[[rules]]
id = "sentry-org-token-full"
description = "Sentry organization auth token (sntrys_), full documented charset including + / ="
regex = '''\b(sntrys_[A-Za-z0-9+/=]+_[A-Za-z0-9+/]{43})'''
keywords = ["sntrys_"]
source = "getsentry/sentry@88dcaf3f src/sentry/utils/security/orgauthtoken_token.py L17-34"
source_date = "2026-09-30"
fact_ids = []
test = "tests/ledger/test_strip_secrets.py::test_catch_rate_holdout_official"
holdout = "2026-09-30: H1 (demoted) 100%; H2 (official) 100% on holdout (sntrys, n=50); holdout FP 0.52% with all rules; H3 (official, 2026-09-30, per-character caught): 100%, longest surviving fragment 0, FP 0/400"

# ---- Boundary-principle rules (D-0011 amendment 6): a token ends at the first character outside its
# format's specified character set. Written after H2 was sealed (633f637), before any H2 measurement.

[[rules]]
id = "jwt-compact"
description = "JWS/JWT compact serialization: three base64url segments; header and payload are JSON objects"
regex = '''(eyJ[A-Za-z0-9_\-]{8,}\.eyJ[A-Za-z0-9_\-]{8,}\.[A-Za-z0-9_\-]*)'''
keywords = ["eyj"]
source = "RFC 7515 §7.1 (compact: BASE64URL(header) . BASE64URL(payload) . BASE64URL(signature)) and §2 (base64url, no padding); RFC 7519 §3; header/payload JSON objects start '{\"' hence 'eyJ'"
source_date = "2026-09-30"
fact_ids = []
test = "tests/ledger/test_strip_secrets.py::test_catch_rate_holdout_official"
holdout = "2026-09-30 H2 (official): 100% (generic JWT hs256 n=50, Supabase service_role n=50) across all 16 H2 contexts; residue 0%; H3 (official, 2026-09-30, per-character caught): 100%, longest surviving fragment 0, FP 0/400"

[[rules]]
id = "sentry-user-token-bounded"
description = "Sentry user auth token: sntryu_ + exactly 64 lowercase hex, ending where the hex run ends"
regex = '''(sntryu_[0-9a-f]{64})(?:[^0-9a-f]|$)'''
secretGroup = 1
keywords = ["sntryu_"]
source = "getsentry/sentry@88dcaf3f src/sentry/models/apitoken.py L106-112 (token_type + secrets.token_hex(nbytes=32)); src/sentry/types/token.py L10"
source_date = "2026-09-30"
fact_ids = []
test = "tests/ledger/test_strip_secrets.py::test_catch_rate_holdout_official"
holdout = "2026-09-30 H2 (official): 100% (sntryu n=50) across all 16 H2 contexts; residue 0%; H3 (official, 2026-09-30, per-character caught): 100%, longest surviving fragment 0, FP 0/400"

[[rules]]
id = "gitlab-pat-routable-current"
description = "GitLab routable PAT as generated by GitLab's RoutableToken: prefix, base64url payload, '.', 2-char base36 version, '.', 2-char base36 length, 7-char base36 CRC32"
regex = '''(glpat-[A-Za-z0-9_\-]+\.[0-9a-z]{2}\.[0-9a-z]{2}[0-9a-z]{7})(?:[^0-9a-z]|$)'''
secretGroup = 1
keywords = ["glpat-"]
source = "gitlab-org/gitlab@18c8707f lib/authn/token_field/generator/routable_token.rb (encode_payload, append_crc, crc_of); app/models/personal_access_token.rb L22"
source_date = "2026-09-30"
fact_ids = []
test = "tests/ledger/test_strip_secrets.py::test_catch_rate_holdout_official"
holdout = "2026-09-30 H2 (official): 100% (glpat routable n=50) across all 16 H2 contexts; residue 0% (the older gitlab-pat rule only redacted the first 20 chars); H3 (official, 2026-09-30, per-character caught): 100%, longest surviving fragment 0, FP 0/400"
