[project]
name = "nacre"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",  # D-0006 amendment 1: production connection setup
    "cryptography>=45",
    "google-re2==1.1.20251105",  # D-0009: exact pin; upgrades re-run scripts/a0017
    # D-0024 (owner decision 4): the local embedder runtime and vector math; exact pins. Only
    # src/nacre/recall/embed_local.py imports onnxruntime and tokenizers.
    "numpy==2.5.3",
    "onnxruntime==1.30.0",
    "tokenizers==0.23.2",
    # D-0027 (owner decision 3, §3, §4): binary attachment scanning; exact pins. pypdf reads PDF text layers,
    # pypdfium2 renders image-only pages, rapidocr runs OCR on the onnxruntime above with the ONNX models shipped in
    # its wheel (sha256-pinned in src/nacre/ledger/ocr_image_text.py). rapidocr requires Pillow at runtime, so the
    # D-0006 amendment 2 test-only pin becomes a runtime pin at the same version (flagged to the owner).
    "pypdf==6.19.0",
    "pypdfium2==5.13.0",
    "rapidocr==3.9.2",
    "Pillow==12.3.0",
    # D-0006 amendment 3 (owner condition): the headless OpenCV build, never opencv-python (GUI/Qt). rapidocr
    # declares opencv-python, so it is dropped by the override below (uv) or by installing the hash-locked
    # requirements.lock with --no-deps (pip). scripts/check_dependency_lock.py fails if opencv-python is installed.
    "opencv-python-headless==5.0.0.93",
]

[project.optional-dependencies]
# D-0021: provider SDKs are optional extras, exact pins; imported only by their adapter in src/nacre/models/.
openai = ["openai==3.22.1"]
# Test-only (D-0008): cbor2 is a cross-check oracle, never imported by src/.
test = [
    "pytest>=9",
    "cbor2==6.1.4",
    "hypothesis>=6",
    "Pillow==12.3.0",   # D-0006 amendment 2: test-only, I1 OCR set (D-0027); committed images are the truth
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# D-0011 amendment 8: holdout measurements are slow; they run when rules, detector code or the corpus
# change (the pre-commit hook does this), or explicitly with `pytest -m holdout`.
markers = ["holdout: slow A-0010 holdout/working measurements and holdout pins",
           "bench: A-0007 latency benchmarks (timing-sensitive; run with `pytest -m bench` on a quiet machine)"]
addopts = "-m 'not holdout and not bench'"

[tool.uv]
# D-0006 amendment 3: never install rapidocr's opencv-python; opencv-python-headless (above) provides cv2.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]
