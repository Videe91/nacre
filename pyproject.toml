[project]
name = "nacre"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "cryptography>=45",
    "google-re2==1.1.20251105",  # D-0009: exact pin; upgrades re-run scripts/a0017
]

[project.optional-dependencies]
# Test-only (D-0008): cbor2 is a cross-check oracle, never imported by src/.
test = [
    "pytest>=9",
    "cbor2==6.1.4",
    "hypothesis>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
