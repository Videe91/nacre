[project]
name = "nacre"
version = "0.0.1"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",  # D-0006 amendment 1: production connection setup
    "cryptography>=45",
    "google-re2==1.1.20251105",  # D-0009: exact pin; upgrades re-run scripts/a0017
]

[project.optional-dependencies]
# D-0021: provider SDKs are optional extras, exact pins; imported only by their adapter in src/nacre/models/.
openai = ["openai==3.22.1"]
# Test-only (D-0008): cbor2 is a cross-check oracle, never imported by src/.
test = [
    "pytest>=9",
    "cbor2==6.1.4",
    "hypothesis>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# D-0011 amendment 8: holdout measurements are slow; they run when rules, detector code or the corpus
# change (the pre-commit hook does this), or explicitly with `pytest -m holdout`.
markers = ["holdout: slow A-0010 holdout/working measurements and holdout pins",
           "bench: A-0007 latency benchmarks (timing-sensitive; run with `pytest -m bench` on a quiet machine)"]
addopts = "-m 'not holdout and not bench'"
